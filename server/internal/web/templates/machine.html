{{template "top" .}}
  <div class="grid2">
  {{range .Body}}
    <div class="card"><div class="head"><div><h2>{{.Title}}</h2><div class="cap">{{.Now}}</div></div></div>{{.Chart}}</div>
  {{else}}
    <div class="empty">No figures from this machine yet.</div>
  {{end}}
  </div>
  <p><a class="pill white" href="/machines?range={{.Range.Name}}">← All machines</a></p>
{{template "bottom" .}}
